<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041720">
  <meta name="description" content="Travel photographs and films by Vineet Velmurugan. Explore the world through first light, daylight, golden hour, and the quiet of night.">
  <title>Chasing the Light — Vineet Velmurugan</title>
  <link rel="stylesheet" href="light.css">
  <script src="config.js" defer></script>
  <script src="films.js" defer></script>
  <script src="light.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#photography">Skip to photographs</a>
  <header class="site-header">
    <a class="site-name" id="site-name" href="index.html"></a>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation"></nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" id="hero-image" fetchpriority="high" decoding="async" alt="">
      <div class="hero-shade"></div>
      <div class="hero-content">
        <h1 id="hero-title"></h1>
        <p id="hero-subtitle"></p>
      </div>
      <div class="light-tabs" id="photography" role="tablist" aria-label="Explore photographs by light"></div>
    </section>
    <section class="gallery-section" aria-label="Selected photographs">
      <div id="gallery-panel" role="tabpanel" tabindex="0">
        <div class="gallery-track" id="gallery-track"></div>
        <p class="empty-gallery" id="empty-gallery" hidden></p>
      </div>
      <div class="gallery-controls">
        <p class="sr-only" id="gallery-status" role="status"></p>
        <span class="gallery-counter" id="gallery-counter" aria-hidden="true"></span>
        <button class="round-button" id="gallery-prev" type="button" aria-label="Previous photographs">←</button>
        <button class="round-button" id="gallery-next" type="button" aria-label="Next photographs">→</button>
      </div>
    </section>
    <section class="films-section" id="films" aria-labelledby="films-title">
      <div class="section-heading">
        <h2 id="films-title"></h2>
        <a id="films-link" href="videos.html"></a>
      </div>
      <div class="film-grid" id="film-grid"></div>
    </section>
  </main>
  <footer class="site-footer">
    <a class="footer-name" id="footer-name" href="info.html"></a>
    <div class="footer-details"><a id="contact-link">Contact</a><a id="youtube-link" target="_blank" rel="noopener noreferrer">YouTube</a><span id="copyright"></span></div>
  </footer>
  <dialog class="photo-viewer" id="photo-viewer" aria-label="Full-screen photograph">
    <button type="button" class="viewer-close round-button" id="viewer-close" aria-label="Close photograph">×</button>
    <div class="viewer-stage"><img id="viewer-image" alt=""></div>
    <div class="viewer-bottom">
      <p id="viewer-caption" aria-live="polite"></p>
      <div class="viewer-controls">
        <button class="round-button" type="button" id="viewer-prev" aria-label="Previous photograph">←</button>
        <span id="viewer-counter"></span>
        <button class="round-button" type="button" id="viewer-next" aria-label="Next photograph">→</button>
      </div>
    </div>
  </dialog>
  <noscript><p class="noscript">Enable JavaScript to browse the photographs. You can still <a href="https://www.youtube.com/@vineet.velmurugan">watch the films on YouTube</a>.</p></noscript>
</body>
</html>
